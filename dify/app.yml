            호텔에서 걸어서 집결하는 한국어 투어다. 츄라우미는 화요일이 한산한 편이다. 전날 쇼핑이 길었으니 투어 중 자유시간은 앉아서 쉬는 데 쓴다. 다음 날은 이동만 한다.

