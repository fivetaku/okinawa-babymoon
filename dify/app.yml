            - 도착일 15:50엔 레쿠에 서는 공항 리무진이 없다(14:10 한 편). TK05 차탄셔틀 17:15(새 ⑤번 승강장, 차탄 18:25 도착) 또는 택시.

            - 공항 리무진(오키나와버스)은 예약은 필요 없지만 승차권을 미리 사야 한다. 차내 현금 결제 불가. 레쿠 프런트·공항 1층 리무진 안내센터·発車オーライネット에서 구매, 좌석 정원제.

            - 지노투어 북부(마이리얼트립 3419221) 2명 예약 완료. 한국어 가이드, 집결 때 대표자 이름을 말하면 된다. 11/24까지 전액 환불.

            - 오키나와 노선버스 주유패스(1일 2,900엔)는 리무진·TK05에 안 쓰여서 이 일정엔 손해. 노선버스는 95번 한 번뿐.

            - 2026-11-01부터 일본 면세는 매장 할인이 아니라 출국 시 공항 세관 환급제다. 매장에선 세금 포함가로 결제하고, 같은 매장·같은 날 세전 5,000엔 이상이면 대상이다. 특수포장·미개봉 의무는 없어졌지만 과자·화장품 같은 소모품을 일본에서 쓰면 환급이 안 된다. 체크인·수하물 위탁 전에 국제선 3F 세관 키오스크로 가고, 대행 수수료가 붙어 실제 환급은 10%보다 적다.

            - 귀국 면세한도는 1인 USD 800이고 인천 출국 때 산 면세품도 합산한다. 술은 별도로 2L·USD 400까지이고 병 수 제한은 없어졌다.

            - 돈키호테는 세금 포함 11,000엔 이상 5% 쿠폰이 있다. 실시간 바코드라 캡처는 안 되고 면세 환급과 같이 쓸 수 있다.

            - 레쿠 온천 여성탕: 대욕장 42도·미스트사우나 45도·백탕 30도. 사우나는 피하고 백탕 위주, 42도는 짧게. 온수풀 이용은 주치의와 상의.

            - 임산부가 피할 음식: 회·초밥·생굴·생새우·우미부도·덜 익힌 고기·반숙·생햄·훈제연어·비살균 치즈. 식당에 보여 줄 문구 「妊娠中です。生魚、生牡蠣、生肉、半熟卵は食べられません。」

            - 파르코시티는 뺐다. 유니클로·GU·다이소·로프트·포켓몬센터는 라이카무에 있고, 무인양품은 아카짱혼포와 같은 함비타운 1층(09~22시)에 있다. 파르코시티에만 있는 건 핸즈·지브리숍.

            - 11월 말 오키나와는 낮 23~27도, 밤 19~20도. 반팔에 얇은 겉옷, 바람막이·우산. 코트는 불필요.

            - 여행 원칙: 렌터카 없이 공항 리무진·TK05 셔틀·버스투어·택시로 다닌다. 하루에 큰 일정은 하나, 쇼핑은 한 곳에 2시간까지, 오후에는 쉰다. 우선순위는 북부투어, 리조트 휴식과 아메리칸빌리지, 쇼핑 순.

            - 제주항공·진에어 모두 32주 미만은 서류 없이 탑승한다. 우선 수속·우선좌석은 임신확인서로 증빙하니 산모수첩과 함께 챙긴다.

            - 최종안(2026-11-09 확정, 아시비나 포함. v1·v2는 상단 토글): 11/30을 TK05로 국제거리 먼저, 택시로 아시비나, 95번+TK05로 복귀하는 순서로 바꿨다. 아침 수영이 생기고 리무진 승차권은 2장만 산다. 11/29 아카짱혼포는 해안길 도보(약 35분)로 가고 짐이 많을 때만 택시를 탄다. TK05 차탄 도착은 18:15가 아니라 18:25다.

